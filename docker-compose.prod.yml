services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paravalves}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paravalves}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paravalves}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-paravalves}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-paravalves}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:?set FILE_TOKEN_SECRET}
      COOKIE_SECURE: "true"
      WEBSITE_INQUIRY_API_KEY: ${WEBSITE_INQUIRY_API_KEY:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Paravalves <no-reply@paravalves.com>}
    ports:
      - "3000:3000"

volumes:
  pgdata:
